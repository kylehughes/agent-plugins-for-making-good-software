name: Validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test validation and catalog tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate manifests, skills, and agents
        run: python3 scripts/validate.py
